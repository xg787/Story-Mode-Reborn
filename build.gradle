plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url 'https://cursemaven.com' }
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientAndServer
    clientOnly
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        runtimeClasspath.from(configurations.clientAndServer)
        runtimeClasspath.from(configurations.clientOnly)
    }

    clientNoQOL {
        run 'client'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        runtimeClasspath.from(configurations.clientAndServer)
        argument '--nogui'
    }

    serverNoQOL {
        run 'server'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "curse.maven:platform-997634:9236357"
    implementation "curse.maven:vanillabackport-417430:9243543"

    compileOnly "curse.maven:fancy-tab-sections-1537163:8800690"

    //Runtime QOL
    clientAndServer "curse.maven:advanced-worldgen-info-1661937:8707774"
    clientAndServer "curse.maven:enderpearl-backport-1367059:7217780"
    clientAndServer "curse.maven:advanced-loot-info-1205426:8709548"
    clientAndServer "curse.maven:advanced-core-info-1661923:8707768"
    clientAndServer "curse.maven:xaeros-world-map-317780:9067277"
    clientAndServer "curse.maven:xaeros-minimap-263420:9067173"
    clientAndServer "curse.maven:armor-poser-450663:8542862"
    clientAndServer "curse.maven:jade-324717:7545219"
    clientAndServer "curse.maven:emi-580555:8081408"
    clientAndServer "curse.maven:jei-238222:7420587"

    clientOnly "curse.maven:better-modlist-neoforge-1089803:8605756"
    clientOnly "curse.maven:coordinates-display-646464:5852301"
    clientOnly "curse.maven:nbt-autocomplete-813557:8934780"
    clientOnly "curse.maven:architectury-api-419699:8492726"
    clientOnly "curse.maven:cloth-config-348521:5729127"
    clientOnly "curse.maven:quick-skin-1323980:9142868"
    clientOnly "curse.maven:mouse-tweaks-60089:5637846"
    clientOnly "curse.maven:free-cam-557076:5572364"
    clientOnly "curse.maven:betterf3-401648:5873258"
    clientOnly "curse.maven:cirrus-1572354:8996611"
    clientOnly "curse.maven:boxlib-1021348:6469303"
    clientOnly "curse.maven:yacl-667299:7437845"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
